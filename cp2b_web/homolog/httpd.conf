# Homologação local: Apache no papel do vhost cp2b.unicamp.br da VM.
#
# Só reproduz o que se sabe do vhost real (ver deployment/apache2/ e o
# cabeçalho de deployment/apache2/cp2b.conf, que está defasado):
#   - DocumentRoot no dist/ do build, com AllowOverride All, para as regras
#     efetivas virem do .htaccess publicado no build;
#   - ProxyPreserveHost On e /api/ e /uploads encaminhados ao backend;
#   - mod_deflate nos tipos de texto, como no padrão do Apache do Debian.
# Cabeçalhos de segurança e de cache ficam de fora de propósito: não se sabe
# quais o vhost real define, e a auditoria contra produção é que mostra.
#
# Uso: npm run homolog (ver scripts/homolog.mjs).

ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so

User daemon
Group daemon

ServerName cp2b.homolog.local
ServerTokens Prod
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %t \"%r\" %>s %b" homolog
CustomLog /proc/self/fd/1 homolog

TypesConfig conf/mime.types
DirectoryIndex index.html

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

ProxyPreserveHost On
ProxyPass        /api/ http://backend:3001/api/
ProxyPassReverse /api/ http://backend:3001/api/
ProxyPass        /uploads http://backend:3001/uploads
ProxyPassReverse /uploads http://backend:3001/uploads

AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json application/xml image/svg+xml
